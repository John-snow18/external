
<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #5a4fcf;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #5a4fcf;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4035a5;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Event Registration</h1>
        <p>Register now to participate in our event!</p>

        <form id="registrationForm">

            <label>Full Name:</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label>Email Address:</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Phone Number:</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number"
                   pattern="[0-9]{10}" required>

            <label>Select Event:</label>
            <select id="event" required>
                <option value="">-- Select Event --</option>
                <option>Web Development Workshop</option>
                <option>Coding Competition</option>
                <option>Technical Seminar</option>
                <option>Cultural Fest</option>
            </select>

            <label>Gender:</label>
            <select id="gender" required>
                <option value="">-- Select Gender --</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <button type="submit">Register Now</button>

        </form>

        <div id="message"></div>

    </div>

    <script>
        document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let eventName = document.getElementById("event").value;
            let gender = document.getElementById("gender").value;

            let message = document.getElementById("message");

            message.style.color = "green";

            message.innerHTML =
                "Registration Successful!<br><br>" +
                "Name: " + name + "<br>" +
                "Email: " + email + "<br>" +
                "Phone: " + phone + "<br>" +
                "Event: " + eventName + "<br>" +
                "Gender: " + gender;

            document.getElementById("registrationForm").reset();

        });
    </script>

</body>
</html>
